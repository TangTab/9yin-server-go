[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=1
// 主实体名称
MainEntity=MainConsole
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
FsKit.dll
FsComm.dll
FsRobot.dll

// 脚本文件
[Script]
// 所在路径
Path=..\Lua\GameRobot
// 是否即时重新加载
Reload=1

[Main]
// 连接数量上限
MaxPlayer=1024
// IO线程数
SockThreads=1
// 通讯消息编码加密键（必须和服务器端相同才能正确通讯）
//MessageEncodeKey=A5375CAE

// 外网IP地址
[Outer]
Addr=127.0.0.1
Port=2001

