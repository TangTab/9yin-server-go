[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=1
// 主实体名称
MainEntity=MainConsole
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
FsKit.dll
FsSql.dll
FsComm.dll
FsEntry.dll
FsStore.dll
FsMember.dll
FsServer.dll
FsPublic.dll
FsCollide.dll

// 脚本文件
[Script]
// 所在路径
Path=..\Lua\GameUnite
// 是否即时重新加载
Reload=1

// 资源文件
[Resource]
// 所在路径
Path=..\Res

[Main]
// 游戏分区编号
DistrictID=1
// 服务器编号
ServerID=11
// 服务器名称
ServerName=server_11
// 公共数据逻辑DLL文件名
PublicLogicDll=FsPubLogic.dll
// 使用MYSQL数据库
UseMysql=true
// 通讯消息编码加密键（必须和客户端相同才能正确通讯）
//MessageEncodeKey=A5375CAE
// 通讯消息校验模块名称
//MessageVerifyDll=fsverify.dll

// 内网地址
[Inner]
//Addr=127.0.0.1
//Port=5000

// 内网广播地址
[Broadcast]
//Addr=127.255.255.255
//Port=4001

// 外网IP地址
[Outer]
Addr=127.0.0.1
Port=2001

// 游戏逻辑模块
[Logic]
Path=
Modules=1
Module0=FsGame.dll

// 计费应用服务器IP地址
[Charge]
Inuse=false
Addr=127.0.0.1
Port=6000

// 运营管理IP地址
[ManageServer]
Inuse=true
Addr=127.0.0.1
Port=4002

// 帐号数据配置
[Account]
//ConnectString=Provider=SQLOLEDB;Password=nineyin123;User ID=nineyin;Initial Catalog=nx_district;Data Source=127.0.0.1:3306
ConnectString=Provider=SQLOLEDB;Password=nineyin123;User ID=nineyin;Initial Catalog=nx_district;Data Source=127.0.0.1:3306
ConnectPool=3

// 角色数据库配置
[Role]
//ConnectString=Provider=SQLOLEDB;Password=nineyin123;User ID=nineyin;Initial Catalog=nx_base;Data Source=127.0.0.1:3306
ConnectString=Provider=SQLOLEDB;Password=nineyin123;User ID=nineyin;Initial Catalog=nx_base;Data Source=127.0.0.1:3306
ConnectPool=7

// 日志数据库配置
[Log]
ConnectString=
ConnectPool=

// 公共数据库配置
[Public]
ConnectString=
ConnectPool=

// 运营管理数据库配置
[Manage]
//ConnectString=Provider=SQLOLEDB;Password=nineyin123;User ID=nineyin;Initial Catalog=nx_base;Data Source=127.0.0.1:3306
ConnectString=Provider=SQLOLEDB;Password=nineyin123;User ID=nineyin;Initial Catalog=nx_base;Data Source=127.0.0.1:3306
ConnectPool=1

