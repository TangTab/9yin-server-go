[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=-1
// 主实体名称
MainEntity=SoloRobot
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
fskit.dll
fscomm.dll
fssolorobot.dll

// 脚本文件
[Script]
// 所在路径
Path=..\lua\solorobot
// 是否即时重新加载
Reload=1

[Main]
// 连接数量上限
MaxPlayer=2000
// 并发连接人数
ConnectConcurrent=50
// 每秒连接人数
ConnectSpeed=100
// 通讯消息编码加密键（必须和服务器端相同才能正确通讯）
//MessageEncodeKey=A5375CAE
// 进入游戏后多少秒钟移动一次
MoveSeconds=5

// 外网IP地址
[Outer]
Addr=127.0.0.1
Port=2001

