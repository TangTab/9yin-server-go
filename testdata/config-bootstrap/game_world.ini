[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=-1
// 主实体名称
MainEntity=SoloWorld
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
fskit.dll
fscomm.dll
fssoloworld.dll

// 脚本文件
[Script]
// 所在路径
Path=..\lua\soloworld
// 是否即时重新加载
Reload=1

// 资源文件
[Resource]
// 所在路径
Path=..\res

[Main]
// 游戏分区编号
DistrictID=3
// 服务器编号
ServerID=11
// 服务器名称
ServerName=server_11
//创建角色对名字的限制
RoleNameSizeLimit=18

// 内网地址
[Inner]
Addr=127.0.0.1

// 内网广播地址
[Broadcast]
Addr=127.255.255.255
Port=4001

// 计费应用服务器IP地址
[Charge]
Inuse=false
Addr=127.0.0.1
Port=6000

// 运营管理IP地址
[ManageServer]
Inuse=true
Addr=127.0.0.1
Port=4002

// 转储服务器地址
[DumpServer]
Inuse=false
Addr=127.0.0.1
Port=4006

// 客服服务器地址
[Gmcc]
Inuse=false
Addr=192.168.1.120
Port=5100

// 监控服务器地址
[Monitor]
Inuse=true
Addr=127.0.0.1
Port=4008



