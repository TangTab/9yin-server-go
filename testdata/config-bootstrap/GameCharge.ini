[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=1
// 主实体名称
MainEntity=MainConsole
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
FsKit.dll
FsSql.dll
FsComm.dll
FsCharge.dll

// 脚本文件
[Script]
// 所在路径
Path=..\Lua\GameCharge
// 是否即时重新加载
Reload=1

[Main]
// 游戏编号 1:航海世纪
GameID=1
// 游戏服务器起始编号
ServerIDOffset=0
// 每点对应的游戏时间（分钟）
PointMinutes=6
// 定时导出用户信息间隔时间（分钟）
AutoDumpMinutes=10
// 提醒余额不足间隔时间（秒）
AwakeTime=60
// 连续多少次扣费不成功时转入程序自主判断，如果费用不够将把玩家踢下线
FlushErrorMax=0
// 用户不活动的最大时间（秒），超过这个时间系统自动将此用户信息清除（暂时未用）
UserShakeTime=3600
// 写日志到控制台
//ConsoleLog=1
// 写日志到文件
//FileLog=1
// 是否记录扣费成功日志（不记的话可以减少日志文件大小）
FlushLog=1

// 分区数据库
[DISTRICT]
ConnString=Provider=OraOLEDB.Oracle;Password=o_chargeapp_xn;User ID=sn_chargeapp;Data Source=CAS
