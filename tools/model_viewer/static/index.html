<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>九阴角色模型浏览器</title>
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./static/vendor/three.module.js",
    "three/addons/": "./static/vendor/"
  }
}
</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="logo">九阴 · 角色模型浏览器 <span id="lib-info"></span></div>
    <div id="tabs">
      <button class="tab active" data-tab="models">模型 <span id="model-count" class="cnt"></span></button>
      <button class="tab" data-tab="anims">动画 <span id="anim-count" class="cnt"></span></button>
    </div>
    <div id="tab-models" class="tabpane active">
      <div id="model-groups"></div>
    </div>
    <div id="tab-anims" class="tabpane">
      <div id="anim-filters">
        <input id="anim-search" type="text" placeholder="搜索动画名 / 文件名…">
        <select id="anim-gender"><option value="">全部性别</option><option>男</option><option>女</option></select>
        <select id="anim-cat"><option value="">全部分类</option></select>
      </div>
      <div id="anim-list-wrap">
        <div id="anim-list-spacer"></div>
        <div id="anim-list"></div>
      </div>
      <div id="anim-list-status"></div>
    </div>
  </aside>
  <main id="main">
    <div id="viewport"></div>
    <div id="hud">
      <div id="hud-model" class="hud-box"></div>
      <div id="hud-anim" class="hud-box"></div>
      <div id="hud-warn" class="hud-box warn" hidden></div>
    </div>
    <div id="toolbar">
      <label><input type="checkbox" id="opt-skeleton"> 骨架</label>
      <label><input type="checkbox" id="opt-wireframe"> 线框</label>
      <label><input type="checkbox" id="opt-texture" checked> 贴图</label>
      <label><input type="checkbox" id="opt-rotate"> 自动旋转</label>
      <label><input type="checkbox" id="opt-dark-bg" checked> 深色背景</label>
    </div>
    <div id="playbar">
      <button id="btn-play" title="空格">▶</button>
      <select id="speed">
        <option value="0.1">0.1×</option><option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option>
      </select>
      <input id="frame-slider" type="range" min="0" max="100" value="0" step="any">
      <span id="frame-label">0 / 0</span>
      <span id="time-label">0.00s</span>
      <label class="loop"><input type="checkbox" id="opt-loop" checked> 循环</label>
    </div>
  </main>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
