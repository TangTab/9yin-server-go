// 9yin-server-go sololister 默认配置（首次运行自动释放；修改后重启生效）
//
// 方言对齐官方小写系 game_lister.ini（game_lister.exe + fssololister.dll，
// 九阴 solo 体系权威形态；BGserverCJ 目录中大写 Game*.ini 是黑金 Fs 系
// 另一套产品线，勿混）：'//' 为整行注释，注释掉的键视为缺省；[Module]
// 节为官方方言的裸行模块列表；键缺省值 = 官方 Lua main.lua ReadXxx 第三参。
//
// 本实现接线：[Outer] Addr/Port=客户端监听、[Inner] Addr=注册口绑定、
// [Broadcast] Addr/Port=广播目标与双口端口（127.0.0.1 时单口，其余双口
// ——本地口自动中继）、[Main] 全键（IDC/DistrictID/ListerID/MaxConnects/
// ClientVersion）；[System]/[Module]/[Script]/[Echo] 为官方方言兼容保留。

[System]
// 循环休眠毫秒数（小于0则不休眠；小写系官方原值 -1）
Sleep=-1
// 主实体名称
MainEntity=SoloLister
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（官方方言裸行列表；本实现不使用）
[Module]
fskit.dll
fscomm.dll
fssololister.dll

// 脚本文件（本实现不使用）
[Script]
Path=..\lua\sololister
// 是否即时重新加载
Reload=1

[Main]
// 网络接入商编号（选线过滤：>0 时仅下发 line_id==IDC 的线）
IDC=0
// 游戏分区编号（注册包准入门：pkt+0x1C 必须相等）
DistrictID=1
// 列表服务器编号（官方 0..7）
ListerID=0
// 连接数量上限
MaxConnects=1024
// 最小客户端版本门：>0 时请求须 "svrlist <ver>" 且版本达标，否则回
// $version_error；0 或注释掉=不设门
//ClientVersion=105

// 外网地址：客户端 svrlist 监听（客户端编死 4000，改端口须客户端侧同步）
[Outer]
Addr=127.0.0.1
Port=4000

// 内网地址：注册口绑定（官方 127.0.0.1=单机单口；跨机填本机内网 IP
// 则自动加建本地环回中继口）
[Inner]
Addr=127.0.0.1

// 内网广播地址：world/entry 注册包的广播目标（同端口双口共用）
[Broadcast]
Addr=127.255.255.255
Port=15000
