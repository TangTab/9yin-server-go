[Broadcast]
//Addr=127.255.255.255
//Port=4001

// 外网IP地址
[Outer]
Addr=127.0.0.1
Port=2001

// 游戏逻辑模块
[Logic]
Path=
Modules=2
Module0=fsgame.dll
Module1=SnailEditor.dll

