[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=-1
// 主实体名称
MainEntity=SoloWorld
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
fskit.dll
fssql.dll
fscomm.dll
fscollide.dll
fssololog.dll
fssoloentry.dll
fssolostore.dll
fssolomember.dll
fssoloworld.dll
fssolopublic.dll
fssoloauction.dll

// 脚本文件
[Script]
// 所在路径
Path=..\lua\solounite
// 是否即时重新加载
Reload=1

// 资源文件
[Resource]
// 所在路径
Path=..\res

[Main]
// 游戏分区编号
DistrictID=1
// 服务器编号
ServerID=11
// 服务器名称
ServerName=server_11
//创建角色对名字的限制
RoleNameSizeLimit=18
// 公共数据逻辑DLL文件名
PublicLogicDll=fspublogic.dll
// 拍卖行数据逻辑DLL文件名
AuctionLogicDll=fsauctionlogic.dll
// 场景碰撞信息文件的根路径
CollideRootPath=..\Res\map
//CollideRootPath=..\..\..\01_Client\Exec\res\map\ter
// 使用MYSQL数据库
UseMysql=true
// 记录数据库性能
//LogDBPerformance=true
// 通讯消息编码加密键（必须和客户端相同才能正确通讯）
//MessageEncodeKey=A5375CAE
// 通讯消息校验模块名称
//MessageVerifyDll=fsverify.dll

// 内网地址
[Inner]
//Addr=127.0.0.1
//Port=5000

