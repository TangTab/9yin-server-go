// 9yin-server-go solo 默认配置（首次运行自动释放；修改后重启生效）
//
// 方言对齐官方小写系 game_entry.ini（game_entry.exe → FsSoloEntry.dll/
// 九阴 solo 接入服——BGserverCJ 目录中大写 GameEntry.ini 是黑金 Fs 系
// 另一套产品线，勿混）：'//' 为整行注释，注释掉的键视为缺省；
// [Module] 节为官方方言的裸行模块列表。
//
// 本实现接线：[Outer] Addr/Port=客户端网关监听，[Main] ClientVersion=
// op02 版本门（帧 [1:5] 须相等，不符回官方 {0x03, u32 20101} 并断连；
// 0=不校验），MessageEncodeKey=传输 XOR 键（空/缺省=现代客户端内置键）。
// MaxConnects/IDC/DistrictID/ServerID/EntryID/MessageVerifyDll 与
// [System]/[Module]/[Script]/[Inner]/[Broadcast]/[Echo] 为官方方言兼容
// 保留，本实现仅呈现不使用（多进程拆分里程碑再接）。
// svrlist 是另一进程（game_lister.ini/cmd/lister），本配置不含。

[System]
// 循环休眠毫秒数（小于0则不休眠；小写系官方原值 -1）
Sleep=-1
// 主实体名称（小写系官方值 SoloEntry）
MainEntity=SoloEntry
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（官方方言裸行列表；Go 单进程等价物=solo 本体）
[Module]
fskit.dll
fscomm.dll
fssoloentry.dll

// 脚本文件（本实现不使用）
[Script]
Path=..\lua\soloentry
// 是否即时重新加载
Reload=1

[Main]
//BindCore=0
// 网络接入商编号
IDC=1
// 游戏分区编号
DistrictID=1
// 服务器编号
ServerID=11
// 组内接入编号
EntryID=0
// 连接数量上限（本实现未接线，仅呈现）
MaxConnects=1024
// 客户端版本门：0=不校验；>0 时 op02 帧 [1:5] 版本号须与之相等。
// 现代客户端观测值=333（testdata golden login-connect-001.bin）
ClientVersion=0
// 通讯消息编码加密键（十六进制，官方样本 A5375CAE；须与客户端一致）。
// 现代客户端编死键=FA6D3BCC；留空/注释掉=沿用内置现代键
//MessageEncodeKey=A5375CAE
// 通讯消息校验 DLL（官方 fsverify.dll 消息校验/槽解密插件位；未接线）
//MessageVerifyDll=fsverify.dll

// 外网地址（客户端网关监听）
[Outer]
Addr=127.0.0.1
Port=9600

// 内网地址（多进程拆分后接线）
[Inner]
//Addr=127.0.0.1
//Port=16200

// 内网广播（多进程拆分后接线）
[Broadcast]
//Addr=127.255.255.255
//Port=15000

// 维护连接（官方 echo 调试台；Go 未接线）
[Echo]
//Addr=127.0.0.1
//Port=15200
