// 9yin-server-go lister 默认配置（首次运行自动释放；修改后重启生效）
//
// 方言对齐官方小写系 game_lister.ini（FsSoloLister/九阴 solo 体系——
// BGserverCJ 目录中大写 Game*.ini 是黑金 Fs 系另一套产品线，勿混）：
// '//' 为整行注释，注释掉的键视为缺省；[Module] 节为官方方言的裸行
// 模块列表。
//
// 本实现接线：[Outer] Addr/Port=监听+下发通告，[Main] ClientVersion=
// 版本门，MaxConnects/IDC/DistrictID/ListerID=解析呈现；[System]/[Module]/
// [Script]/[Inner]/[Broadcast] 为官方方言兼容保留，本实现不使用。

[System]
// 循环休眠毫秒数（小于0则不休眠；小写系官方原值 -1）
Sleep=-1
// 主实体名称（小写系官方值 SoloLister；本实现不使用）
MainEntity=SoloLister
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（官方方言裸行列表；本实现不使用）
[Module]
fskit.dll
fscomm.dll
fssololister.dll

// 脚本文件（本实现不使用）
[Script]
Path=..\lua\sololister
// 是否即时重新加载
Reload=1

[Main]
// 网络接入商编号
IDC=0
// 游戏分区编号
DistrictID=1
// 列表服务器编号
ListerID=0
// 连接数量上限
MaxConnects=1024
// 最小客户端版本门：>0 时请求须 "svrlist <ver>" 且版本达标，
// 否则回 $version_error；0 或注释掉=不设门
//ClientVersion=105

// 外网地址：监听 + 下发通告（客户端 svrlist 编死 4000，改端口须客户端侧同步）
[Outer]
Addr=127.0.0.1
Port=4000

// 内网地址（本实现不使用）
[Inner]
//Addr=127.0.0.1

// 内网广播地址（本实现不使用）
[Broadcast]
//Addr=127.255.255.255
//Port=15000
