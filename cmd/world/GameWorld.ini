[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=1
// 主实体名称
MainEntity=MainConsole
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
FsKit.dll
FsComm.dll
FsServer.dll

// 脚本文件
[Script]
// 所在路径
Path=..\Lua\GameWorld
// 是否即时重新加载
Reload=1

// 资源文件
[Resource]
// 所在路径
Path=..\Res

[Main]
// 游戏分区编号
DistrictID=1
// 服务器编号
ServerID=11
// 服务器名称
ServerName=server_11

// 内网地址
[Inner]
//Addr=127.0.0.1
//Port=5000

// 内网广播地址
[Broadcast]
//Addr=127.255.255.255
//Port=4001

// 计费应用服务器IP地址
[Charge]
Inuse=false
Addr=192.168.33.70
Port=6000



