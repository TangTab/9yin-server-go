// GameCharge.ini 内置默认（官方 BGserverCJ\Debug\GameCharge.ini 方言，
// 本机化：外网 127.0.0.1:6000、免 Oracle——数据库节注释保留官方样例）。
[System]
Sleep=1
DebugLog=1
MainEntity=MainConsole
MainScript=main

[Module]
FsKit.dll
FsSql.dll
FsComm.dll
FsCharge.dll

[Script]
Path=..\Lua\GameCharge
Reload=1

[Main]
// 游戏编号 1:航海世纪（引擎族标识，官方原值保留）
GameID=1
ServerIDOffset=0
// 每点对应的游戏时间（分钟）
PointMinutes=6
// 定时导出用户信息间隔时间（分钟）
AutoDumpMinutes=10
// 提醒余额不足间隔时间（秒）
AwakeTime=60
// 连续多少次扣费不成功时转入程序自主判断（0=不启用踢人）
FlushErrorMax=0
// 用户不活动的最大时间（秒）（官方"暂时未用"）
UserShakeTime=3600
FlushLog=1
MaxClient=16

// 分区数据库（官方 Oracle 方言样例；Go 后端改用 -dsn 接本机 MySQL
// nx_district.dc_accounts，此节保留注释态）
//[DISTRICT]
//ConnString=Provider=OraOLEDB.Oracle;Password=***;User ID=sn_chargeapp;Data Source=CAS
//ConnPool=1

// 中心数据库（同上）
//[CENTER]
//ConnString=Provider=OraOLEDB.Oracle;Password=***;User ID=sn_chargeapp;Data Source=CENTER
//ConnPool=1

// 外网监听（游戏服 ChargeSock 接入）
[Outer]
Addr=127.0.0.1
Port=6000
