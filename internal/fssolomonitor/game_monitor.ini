[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=-1
// 主实体名称
MainEntity=SoloMonitor
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
fskit.dll
fscomm.dll
fssolomonitor.dll

// 脚本文件
[Script]
// 所在路径
Path=..\lua\solomonitor
// 是否即时重新加载
Reload=1

[Main]
// 数据库配置（官方为 SQLOLEDB 方言，Go 复刻经 -mysql-dsn 接真库）
ConnectString=

// 外网IP地址
[Outer]
Addr=127.0.0.1
Port=4008

// 维护连接地址（官方 ini 无此节，lua 本地缺省）
[Echo]
Addr=127.0.0.1
Port=15012
