[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=1
// 主实体名称
MainEntity=MainConsole
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
FsKit.dll
FsSql.dll
FsComm.dll
FsWatch.dll

// 脚本文件
[Script]
// 所在路径
Path=..\Lua\GameWatch
// 是否即时重新加载
Reload=1

[Main]
// 连接数量上限
MaxClient=16
// 开启和关闭服务器的密码[monitor]
MonitorPassword=08B5411F848A2581A41672A759C87380
// 查询数据的密码[query]
QueryPassword=1B1CC7F086B3F074DA452BC3129981EB
// 远程更新密码[update]
UpdatePassword=3AC340832F29C11538FBE2D6F75E8BCC
// 程序启动之后自动锁定系统
LockSystem=0

// 需要启动的服务器程序
[Servers]
// unite_11=D:\flexis\client\cons\debug\fsloader GameUnite.ini

// 可执行文件路径
[ExePath]
// unite_11=D:\temp\update\dst\exe

// 资源文件路径
[ResPath]
// unite_11=D:\temp\update\dst\resource

// 外网IP地址
