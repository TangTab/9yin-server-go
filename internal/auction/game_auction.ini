// 9yin-server-go auction 默认配置（首次运行自动释放；修改后重启生效）
//
// 方言对齐官方 game_auction.ini（game_auction.exe → FsSoloAuction.dll
// 拍卖行数据服务器，BGserverCJ\Debug 同名文件）：'//' 为整行注释，
// 注释掉的键视为缺省；[Module] 节为官方方言的裸行模块列表；
// 官方文件为 GBK 中文注释，本内置默认沿用仓库 UTF-8 惯例。
//
// 本实现接线：[Main] DistrictID/ServerID、[Inner] Addr/Port（16003，
// game 服内网接入）、[Resource] Path（Go 扩展键，ItemType.xml 装载根）。
// SaveMinutes/SaveBatchSize 解析呈现（Store PUB4 持久化里程碑接线）；
// [System]/[Module]/[Script]/[Broadcast]/[Echo] 及 [Account]/[Role]/[Log]/
// [Public] 为官方方言兼容保留（官方拍卖服本体无 SQL，ConnectString
// 属框架遗留，本实现不使用）。

[System]
// 循环休眠毫秒数（小于0则不休眠；官方原值 -1）
Sleep=-1
// 主实体名称（官方值 SoloAuction；本实现不使用）
MainEntity=SoloAuction
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（官方方言裸行列表；本实现为内置等价，不加载 DLL）
[Module]
fskit.dll
fscomm.dll
fssoloauction.dll

// 脚本文件（本实现不使用）
[Script]
Path=..\lua\soloauction
// 是否即时重新加载
Reload=1

[Main]
// 游戏分区编号
DistrictID=1
// 服务器编号
ServerID=11
// 拍卖行数据逻辑 DLL 文件名（本实现为内置等价，仅呈现）
AuctionLogicDll=fsauctionlogic.dll
// 保存公共数据的间隔分钟数（官方 main.lua 缺省 20；持久化里程碑接线）
SaveMinutes=20
// 每轮存盘批量数（官方 Lua 属性，缺省注释；持久化里程碑接线）
//SaveBatchSize=64

// 内网地址：game 服（FsMember）接入侦听
//（官方 main.lua 缺省 127.0.0.1:16003；Addr 注释掉=全部地址）
[Inner]
//Addr=127.0.0.1
Port=16003

// 内网广播地址（服务发现，官方缺省 127.255.255.255:15000；本实现不使用）
[Broadcast]
//Addr=127.255.255.255
//Port=15000

// 维护连接地址（调试口，官方缺省 127.0.0.1:16001；本实现不使用）
[Echo]
//Addr=127.0.0.1
//Port=16001

// Go 扩展：资源根目录（ItemType.xml = <Path>/ini/trade/AuctionHouse/ItemType.xml）
[Resource]
Path=Res

// 以下为官方方言兼容保留（官方文件含 ConnectString，属框架遗留；
// 官方拍卖服本体无 SQL——持久化走 Store 服 PUB4 归档）
[Account]
//ConnectString=Provider=SQLOLEDB;Password=abc&4621;User ID=sa;Initial Catalog=nx_district1;Data Source=127.0.0.1:3306
//ConnectPool=1

[Role]
//ConnectString=Provider=SQLOLEDB;Password=abc&4621;User ID=sa;Initial Catalog=nx_base1;Data Source=127.0.0.1:3306
//ConnectPool=1

[Log]
//ConnectString=Provider=SQLOLEDB;Password=abc&4621;User ID=sa;Initial Catalog=nx_base1;Data Source=127.0.0.1:3306
//ConnectPool=1

[Public]
//ConnectString=Provider=SQLOLEDB;Password=abc&4621;User ID=sa;Initial Catalog=nx_base1;Data Source=127.0.0.1:3306
//ConnectPool=1
