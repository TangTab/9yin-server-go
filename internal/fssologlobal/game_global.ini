[System]
// 循环休眠毫秒数（小于0则不休眠）
Sleep=-1
// 主实体名称
MainEntity=SoloGlobal
// 启动脚本名称
MainScript=main

// 指定加载的组件模块（为空则全部加载）
[Module]
fskit.dll
fssql.dll
fscomm.dll
fssologlobal.dll

// 脚本文件
[Script]
// 所在路径
Path=..\lua\sologlobal
// 是否即时重新加载
Reload=1

[Main]
// 数据库连接串（官方快照为 SQLOLEDB 方言；Go 复刻请用 -mysql-dsn 传 MySQL DSN，
// 或改写为本行 MySQL DSN）
ConnectString=Provider=SQLOLEDB;Password=abc;User ID=sa;Initial Catalog=nx_base1;Data Source=192.168.33.70

// 外网IP地址（Go 复刻内置缺省改为回环可用；原快照 192.168.33.70）
[Outer]
Addr=127.0.0.1
Port=4003

// 维护连接地址（官方 main.lua 本地缺省）
[Echo]
Addr=127.0.0.1
Port=15012
